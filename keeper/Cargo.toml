# SPDX-License-Identifier: Apache-2.0
[package]
name = "safesightmac-keeper"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# The fixed list of cryptographic crates (SD-021). Exact versions. Every crate here is
# lock core: a new one, or a new version, needs a second reader. None of them does any
# networking (SD-018); docs/STEP-2-STATUS.md lists each with its licence.
[dependencies]
# The pairing curve of the public time beacon: round signatures and the time lock.
ark-bls12-381 = "=0.4.0"
ark-ec = "=0.4.2"
ark-ff = "=0.4.2"
ark-serialize = "=0.4.2"
# SHA-256.
sha2 = "=0.10.8"
# The age layer of a capsule: the X25519 recipient, the key steps, the payload cipher.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
x25519-dalek = "=2.0.1"
# Wiping keys and the admin secret from memory.
zeroize = "=1.8.1"

[features]
# The opener's core (SD-066): opening a capsule. Never in the keeper, which only seals.
opener = []

# The command-line opener (SD-066). Built only with the opener feature, so a plain
# `cargo build` makes the keeper alone:
#   cargo build --release --features opener --bin safesightmac-opener
[[bin]]
name = "safesightmac-opener"
required-features = ["opener"]

[profile.release]
panic = "abort"
lto = true

# The pairing code is generic and is compiled into this crate, and it is very slow
# without optimisation. Tests are built optimised, with overflow checks still on.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
