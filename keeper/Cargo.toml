# SPDX-License-Identifier: Apache-2.0
[package]
name = "safesightmac-keeper"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# The fixed list of cryptographic crates (SD-021). Exact versions. Every crate here is
# lock core: a new one, or a new version, needs a second reader. None of them does any
# networking (SD-018); docs/STEP-2-STATUS.md lists each with its licence.
[dependencies]
# The pairing curve of the public time beacon: round signatures and the time lock.
ark-bls12-381 = "=0.4.0"
ark-ec = "=0.4.2"
ark-ff = "=0.4.2"
ark-serialize = "=0.4.2"
# SHA-256.
sha2 = "=0.10.8"

[profile.release]
panic = "abort"
lto = true

# The pairing code is generic and is compiled into this crate, and it is very slow
# without optimisation. Tests are built optimised, with overflow checks still on.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
