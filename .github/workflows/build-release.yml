# SPDX-License-Identifier: Apache-2.0
# On a pushed version tag: builds every part unsigned, lists hashes, uploads them,
# and publishes a signed build-provenance statement for each artifact.
# CI never signs or notarizes; the founder signs from a hardware token (register SD-168).
name: build-release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build unsigned
        run: |
          swift build -c release --product safesightmac-hello
          (cd keeper && cargo build --release)
          (cd keeper && cargo build --release --locked --features opener --bin safesightmac-opener)
          mkdir -p out
          cp "$(swift build -c release --show-bin-path)/safesightmac-hello" out/
          cp keeper/target/release/safesightmac-keeper out/
          cp keeper/target/release/safesightmac-opener out/
          cp opener/index.html out/safesightmac-opener.html
          (cd out && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ github.ref_name }}
          path: out/
